# This file contains common pin mappings for the 2018 Creality
# Ender 3. To use this config, the firmware should be compiled for the
# AVR atmega1284p.

# Note, a number of Melzi boards are shipped with a bootloader that
# requires the following command to flash the board:
#  avrdude -p atmega1284p -c arduino -b 57600 -P /dev/ttyUSB0 -U out/klipper.elf.hex
# If the above command does not work and "make flash" does not work
# then one may need to flash a bootloader to the board - see the
# Klipper docs/Bootloaders.md file for more information.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

[printer]
kinematics: cartesian
max_velocity: 300            # Max travel speed in mm/s (Marlin max_feedrate)
max_accel: 5000              # Max acceleration in mm/s² (Stock Ender 3 usually runs 1500-3000)
max_z_velocity: 10            # Max Z speed in mm/s
max_z_accel: 100             # Max Z acceleration in mm/s²
square_corner_velocity: 5.0  # Klipper's equivalent to Marlin Jerk (5.0 mm/s is safe baseline)

[stepper_x]
step_pin: PD7
dir_pin: !PC5
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC2
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB3
dir_pin: PB2
enable_pin: !PA5
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC4
#position_endstop: 0.0
position_max: 230
position_min: -0.2
homing_speed: 100
second_homing_speed: 5.0

[extruder]
max_extrude_only_distance: 100.0
max_extrude_cross_section: 5.0
step_pin: PB1
dir_pin: !PB0
enable_pin: !PD6
microsteps: 16
rotation_distance: 32.443
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
#control: pid
# tuned for stock hardware with 200 degree Celsius target
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 250
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

[heater_bed]
heater_pin: PD4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA6
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PB4
off_below: 0.15

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AM00PTVL-if00-port0

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0

[resonance_tester]
accel_chip: adxl345
probe_points:
    117.5, 117.5, 20  # Center of your Ender 3 bed

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 46.4
shaper_type_y: mzv
shaper_freq_y: 41.8

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 200, 207
screw4: 200, 37

[display]
lcd_type: st7920
cs_pin: PA3
sclk_pin: PA1
sid_pin: PC1
encoder_pins: ^PD2, ^PD3
click_pin: ^!PC0

# The print bed can move so far to the front, that the nozzle can reach the
# plastic cover of the print bed heater cable (only when the bed is moved by
# hand). By homing the Y axis before the X axis, it is ensured the nozzle will
# not melt through the plastic part.
# BEWARE: You will lose the ability to home axes individually. The printer will
# always home all axes for every G28 command.
#[homing_override]
#gcode:
# G28 Y0
# G28 X0
# G28 Z0

[respond]
default_type: echo

[gcode_macro POWER_DEVICE_ON]
gcode:
    {% set device = params.DEVICE|default("printer") %}
    {action_call_remote_method("set_device_power",
                               device=device,
                               state="on")}

[gcode_macro POWER_DEVICE_OFF]
gcode:
    {% set device = params.DEVICE|default("printer") %}
    {action_call_remote_method("set_device_power",
                               device=device,
                               state="off")}

[gcode_macro PURGE_PATTERN]
description: Slow, high-thoroughness Bambu Flow Dynamics purge & prime sequence
gcode:
    SAVE_GCODE_STATE NAME=PURGE_PATTERN_STATE
    G90                             ; Absolute positioning
    M83                             ; Relative extrusion

    ; ------------------------------------------------------------------
    ; 1. Initial Positioning (Front Left)
    ; ------------------------------------------------------------------
    G1 Z5.0 F3000                   ; Lift Z clear
    G1 X2.0 Y10.0 F6000             ; Move to start coordinate
    G1 Z0.28 F1500                  ; Drop to first layer height

    ; ------------------------------------------------------------------
    ; 2. Heavy Baseline Purge Line (Slow Deep Prime)
    ; ------------------------------------------------------------------
    G1 Y150.0 E12.0 F900            ; Slow 15 mm/s sweep to purge old filament

    ; ------------------------------------------------------------------
    ; 3. Slow Parallel Calibration & Wipe Lines
    ; ------------------------------------------------------------------
    ; Line 1: Ultra-Slow Prime Pass (20 mm/s)
    G1 X4.0 Y150.0 E0.3 F3000       ; Shift right
    G1 Y30.0 E6.0 F1200             ; 20 mm/s pass

    ; Line 2: Moderate Slow Pass (30 mm/s)
    G1 X6.0 Y30.0 E0.3 F3000        ; Shift right
    G1 Y150.0 E6.0 F1800            ; 30 mm/s pass

    ; Line 3: Steady Pass (40 mm/s)
    G1 X8.0 Y150.0 E0.3 F3000       ; Shift right
    G1 Y30.0 E6.0 F2400             ; 40 mm/s pass

    ; Line 4: Step Transition (20 mm/s to 40 mm/s)
    G1 X10.0 Y30.0 E0.3 F3000       ; Shift right
    G1 Y90.0 E3.0 F1200             ; Slow half (20 mm/s)
    G1 Y150.0 E3.0 F2400            ; Stepped half (40 mm/s)

    ; ------------------------------------------------------------------
    ; 4. Right-Side Trailing Step Square (Right End of Pattern)
    ; ------------------------------------------------------------------
    G1 X14.0 Y150.0 E0.3 F3000      ; Move over to trailing square zone
    G1 Y120.0 E1.5 F1800            ; Down side
    G1 X18.0 Y120.0 E0.4 F1800      ; Across top
    G1 Y140.0 E1.0 F1800            ; Up right edge
    G1 X14.0 Y140.0 E0.4 F1800      ; Close box

    ; ------------------------------------------------------------------
    ; 5. Break-away Hop & Exit
    ; ------------------------------------------------------------------
    G1 E-0.5 F3600                  ; Retract filament
    G1 X22.0 Y145.0 Z0.6 F15000      ; Diagonal breakaway hop
    G1 Z2.0 F3000                   ; Lift clear

    RESTORE_GCODE_STATE NAME=PURGE_PATTERN_STATE

[gcode_macro START_PRINT]
gcode:
    # 1. Capture target temperatures from slicer
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set IDLE_TEMP = params.IDLE_TEMP|default(150)|float %}

    # 2. Power on EP25 smart plug & wait 2s for electronics/MCU to stabilize
    POWER_DEVICE_ON
    G4 P2000

    # 3. Use absolute positioning and relative extrusion
    G90
    M83

    # 4. Set non-ooze nozzle temp & target bed temp
    M104 S{IDLE_TEMP}
    M140 S{BED_TEMP}

    # 5. Home all axes
    G28

    # 6. Move toolhead out of the way to start position
    G1 Z50 F240
    G1 X2.0 Y10 F3000

    # 7. Heat to final nozzle & bed temperatures and wait for stabilization
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    # 8. Dual-line purge / prime routine
    PURGE_PATTERN

[delayed_gcode delayed_printer_off]
gcode:
    # Only turn off if hotend is safely under 50C
    {% if printer.extruder.temperature < 50 %}
        POWER_DEVICE_OFF
    {% else %}
        # Check again in 1 minute if still hot
        UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=60
    {% endif %}

[gcode_macro END_PRINT]
gcode:
    # Retract filament slightly to stop oozing
    G91 ; Switch to Relative Positioning
    G1 E-2.0 F2700 ; Retract 2mm filament
    G1 E-3.0 F1200 ; Pull filament clear of melt zone
    
    # Safe Z-Hop calculation
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 20.0) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    
    G1 Z{z_safe} F3000 ; Lift Z safely relative to current height
    
    G90 ; Switch back to Absolute Positioning
    G1 X0 Y220 F6000 ; Present the bed forward
    
    # Turn off heaters and fan
    M106 S0 ; Turn off part cooling fan
    M104 S0 ; Turn off hotend
    M140 S0 ; Turn off bed
    M84 ; Disable steppers

	# Trigger the cooldown monitor loop (starts in 10 seconds)
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=10

