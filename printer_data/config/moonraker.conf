# Sonar update_manager entry
[update_manager sonar]
type: git_repo
path: ~/sonar
origin: https://github.com/mainsail-crew/sonar.git
primary_branch: main
managed_services: sonar
system_dependencies: resources/system-dependencies.json

[power printer]
type: http
on_url: http://127.0.0.1:9991/on
off_url: http://127.0.0.1:9991/off
status_url: http://127.0.0.1:9991/status
response_template: {% if "on" in http_request.last_response().text.lower() %}on{% else %}off{% endif %}
off_when_shutdown: False
on_when_job_queued: True
locked_while_printing: True
restart_klipper_when_powered: True
restart_delay: 3.0
bound_services: klipper

[power IR Lights]
type: http
on_url: http://127.0.0.1:9992/on
off_url: http://127.0.0.1:9992/off
status_url: http://127.0.0.1:9992/status
response_template: {% if "on" in http_request.last_response().text.lower() %}on{% else %}off{% endif %}

[power fire_drill]
type: http
on_url: http://127.0.0.1:9993/drill
off_url: http://127.0.0.1:9993/reset
status_url: http://127.0.0.1:9993/status
response_template: {% if "on" in http_request.last_response().text.lower() %}on{% else %}off{% endif %}
