# This file contains common pin mappings for the 2018 Creality
# Ender 3. To use this config, the firmware should be compiled for the
# AVR atmega1284p.

# Note, a number of Melzi boards are shipped with a bootloader that
# requires the following command to flash the board:
#  avrdude -p atmega1284p -c arduino -b 57600 -P /dev/ttyUSB0 -U out/klipper.elf.hex
# If the above command does not work and "make flash" does not work
# then one may need to flash a bootloader to the board - see the
# Klipper docs/Bootloaders.md file for more information.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

[printer]
kinematics: cartesian
max_velocity: 300            # Max travel speed in mm/s (Marlin max_feedrate)
max_accel: 3000              # Max acceleration in mm/s² (Stock Ender 3 usually runs 1500-3000)
max_z_velocity: 100            # Max Z speed in mm/s
max_z_accel: 100             # Max Z acceleration in mm/s²
square_corner_velocity: 5.0  # Klipper's equivalent to Marlin Jerk (5.0 mm/s is safe baseline)

[stepper_x]
step_pin: PD7
dir_pin: !PC5
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC2
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB3
dir_pin: PB2
enable_pin: !PA5
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC4
position_endstop: 0.0
position_max: 130
homing_speed: 100
second_homing_speed: 5.0

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB1
dir_pin: !PB0
enable_pin: !PD6
microsteps: 16
rotation_distance: 22.904
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
#control: pid
# tuned for stock hardware with 200 degree Celsius target
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PD4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA6
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PB4

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AM00PTVL-if00-port0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 200, 207
screw4: 200, 37

[display]
lcd_type: st7920
cs_pin: PA3
sclk_pin: PA1
sid_pin: PC1
encoder_pins: ^PD2, ^PD3
click_pin: ^!PC0

# The print bed can move so far to the front, that the nozzle can reach the
# plastic cover of the print bed heater cable (only when the bed is moved by
# hand). By homing the Y axis before the X axis, it is ensured the nozzle will
# not melt through the plastic part.
# BEWARE: You will lose the ability to home axes individually. The printer will
# always home all axes for every G28 command.
#[homing_override]
#gcode:
# G28 Y0
# G28 X0
# G28 Z0

[gcode_macro START_PRINT]
gcode:
    # 1. Capture target temperatures from slicer
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set IDLE_TEMP = params.IDLE_TEMP|default(150)|float %}

    # 2. Power on EP25 smart plug & wait 2s for electronics/MCU to stabilize
    POWER_DEVICE_ON POWER="Printer Power"
    G4 P2000

    # 3. Use absolute positioning and relative extrusion
    G90
    M83

    # 4. Set non-ooze nozzle temp & target bed temp
    M104 S{IDLE_TEMP}
    M140 S{BED_TEMP}

    # 5. Home all axes
    G28

    # 6. Move toolhead out of the way to start position
    G1 Z50 F240
    G1 X2.0 Y10 F3000

    # 7. Heat to final nozzle & bed temperatures and wait for stabilization
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    # 8. Dual-line purge / prime routine
    G1 Z0.28 F240
    G92 E0
    G1 X2.0 Y140 E10 F1500 ; First prime line
    G1 X2.3 Y140 F5000
    G92 E0
    G1 X2.3 Y10 E10 F1200  ; Second prime line
    G92 E0

[gcode_macro END_PRINT]
gcode:
    # 1. Capture layer and bed parameters passed from slicer
    {% set MACHINE_DEPTH = params.MACHINE_DEPTH|default(220)|float %}
    {% set LIFT_Z = params.LIFT_Z|default(10)|float %}

    # 2. Turn off heaters and fan
    M104 S0
    M140 S0
    M106 S0

    # 3. Lift Z and move bed forward to present print
    G90
    G1 Z{LIFT_Z} F600
    G1 X5 Y{MACHINE_DEPTH * 0.85} F3000

    # 4. Disable motors
    M84 X Y E

    # 5. Queue 15-minute delayed shutdown (allows nozzle fan to cool below 50C)
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=900

[delayed_gcode delayed_printer_off]
gcode:
    # Only turn off if hotend is safely under 50C
    {% if printer.extruder.temperature < 50 %}
        POWER_DEVICE_OFF POWER="Printer Power"
    {% else %}
        # Check again in 1 minute if still hot
        UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=60
    {% endif %}

